name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Los runners de GitHub ya traen el Android SDK (ANDROID_HOME).
      # La accion android-actions/setup-android@v3 fallaba, asi que se
      # usa el SDK preinstalado y solo se aceptan las licencias.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install npm dependencies
        run: npm install

      - name: Copy web assets to www/
        run: npm run build

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Sync web to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitension-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # El Release es la via de descarga publica del APK: cualquiera puede
      # bajarlo sin iniciar sesion en GitHub (los artifacts si lo exigen).
      # Se reemplaza en cada build.
      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mitension-debug.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest mitension-debug.apk \
            --title "MITENSION APK (debug)" \
            --notes "APK de depuracion generado automaticamente en cada push. Commit: ${{ github.sha }}" \
            --target "${{ github.sha }}"
